<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Car News Slider</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  background:#ececec;
  padding:20px;
}

/* MAIN SLIDER */

.slider{
  width:100%;
  max-width:1200px;
  height:500px;
  margin:auto;
  overflow:hidden;
  border-radius:18px;
  position:relative;
  box-shadow:0 5px 20px rgba(0,0,0,0.2);
}

.slides{
  width:500%;
  height:100%;
  display:flex;
  animation:slide 20s infinite;
}

.slide{
  width:100%;
  height:100%;
  position:relative;
  flex-shrink:0;
}

.slide img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* DARK OVERLAY */

.overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(to top, rgba(0,0,0,0.8), transparent);
}

/* TEXT */

.content{
  position:absolute;
  left:40px;
  bottom:40px;
  color:white;
  z-index:2;
}

.tag{
  background:white;
  color:black;
  display:inline-block;
  padding:6px 12px;
  border-radius:5px;
  font-size:13px;
  font-weight:bold;
  margin-bottom:15px;
}

.content h1{
  font-size:45px;
  max-width:700px;
  line-height:1.2;
}

/* DOTS */

.dots{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:10px;
  z-index:5;
}

.dots span{
  width:12px;
  height:12px;
  background:white;
  border-radius:50%;
  opacity:0.5;
}

/* AUTO SLIDE */

@keyframes slide{

  0%{margin-left:0%;}
  15%{margin-left:0%;}

  20%{margin-left:-100%;}
  35%{margin-left:-100%;}

  40%{margin-left:-200%;}
  55%{margin-left:-200%;}

  60%{margin-left:-300%;}
  75%{margin-left:-300%;}

  80%{margin-left:-400%;}
  95%{margin-left:-400%;}

  100%{margin-left:0%;}
}

/* MOBILE */

@media(max-width:768px){

  .slider{
    height:320px;
  }

  .content{
    left:20px;
    bottom:25px;
  }

  .content h1{
    font-size:26px;
  }

}

</style>

</head>
<body>

<!-- SLIDER -->

<div class="slider">

  <div class="slides">

    <!-- IMAGE 1 -->

    <div class="slide">

      <img src="https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?q=80&w=1600&auto=format&fit=crop">

      <div class="overlay"></div>

      <div class="content">
        <div class="tag">NEWS</div>
        <h1>2026 Mercedes AMG Coupe Revealed</h1>
      </div>

    </div>

    <!-- IMAGE 2 -->

    <div class="slide">

      <img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?q=80&w=1600&auto=format&fit=crop">

      <div class="overlay"></div>

      <div class="content">
        <div class="tag">SPORTS</div>
        <h1>New Lamborghini Hybrid Supercar</h1>
      </div>

    </div>

    <!-- IMAGE 3 -->

    <div class="slide">

      <img src="https://images.unsplash.com/photo-1544636331-e26879cd4d9b?q=80&w=1600&auto=format&fit=crop">

      <div class="overlay"></div>

      <div class="content">
        <div class="tag">EV</div>
        <h1>Electric Cars With AI Technology</h1>
      </div>

    </div>

    <!-- IMAGE 4 -->

    <div class="slide">

      <img src="https://images.unsplash.com/photo-1511919884226-fd3cad34687c?q=80&w=1600&auto=format&fit=crop">

      <div class="overlay"></div>

      <div class="content">
        <div class="tag">REVIEW</div>
        <h1>Porsche 911 Turbo 2026 Review</h1>
      </div>

    </div>

    <!-- IMAGE 5 -->

    <div class="slide">

      <img src="https://images.unsplash.com/photo-1502877338535-766e1452684a?q=80&w=1600&auto=format&fit=crop">

      <div class="overlay"></div>

      <div class="content">
        <div class="tag">TRENDING</div>
        <h1>Ferrari Launches New Hypercar</h1>
      </div>

    </div>

  </div>

  <!-- DOTS -->

  <div class="dots">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
  </div>

</div>

</body>
</html>
