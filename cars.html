<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Banner Slider</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f1f1f1;
  padding:20px;
}

/* SLIDER */

.banner-slider{
  width:100%;
  max-width:1200px;
  height:450px;
  margin:auto;
  overflow:hidden;
  border-radius:20px;
  position:relative;
}

.slider-track{
  display:flex;
  width:500%;
  height:100%;
  animation:slider 25s infinite;
}

.slide{
  width:20%;
  height:100%;
  position:relative;
}

.slide img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* BLACK OVERLAY */

.overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(to top, rgba(0,0,0,0.8), transparent);
}

/* TEXT */

.text{
  position:absolute;
  left:40px;
  bottom:40px;
  color:white;
  z-index:5;
}

.text span{
  background:white;
  color:black;
  padding:6px 14px;
  border-radius:5px;
  font-size:14px;
  font-weight:bold;
}

.text h1{
  margin-top:15px;
  font-size:42px;
  max-width:650px;
  line-height:1.2;
}

/* DOTS */

.navigation{
  position:absolute;
  bottom:20px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:10px;
  z-index:10;
}

.navigation div{
  width:12px;
  height:12px;
  background:white;
  border-radius:50%;
  opacity:0.5;
}

/* ANIMATION */

@keyframes slider{

  0%{
    transform:translateX(0%);
  }

  15%{
    transform:translateX(0%);
  }

  20%{
    transform:translateX(-20%);
  }

  35%{
    transform:translateX(-20%);
  }

  40%{
    transform:translateX(-40%);
  }

  55%{
    transform:translateX(-40%);
  }

  60%{
    transform:translateX(-60%);
  }

  75%{
    transform:translateX(-60%);
  }

  80%{
    transform:translateX(-80%);
  }

  95%{
    transform:translateX(-80%);
  }

  100%{
    transform:translateX(0%);
  }

}

/* MOBILE */

@media(max-width:768px){

  .banner-slider{
    height:300px;
  }

  .text{
    left:20px;
    bottom:20px;
  }

  .text h1{
    font-size:24px;
  }

}

</style>
</head>
<body>

<div class="banner-slider">

  <div class="slider-track">

    <!-- 1 -->

    <div class="slide">

      <img src="https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?q=80&w=1600&auto=format&fit=crop">

      <div class="overlay"></div>

      <div class="text">
        <span>NEWS</span>
        <h1>Mercedes AMG GT Coupe Revealed</h1>
      </div>

    </div>

    <!-- 2 -->

    <div class="slide">

      <img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?q=80&w=1600&auto=format&fit=crop">

      <div class="overlay"></div>

      <div class="text">
        <span>SPORTS</span>
        <h1>Lamborghini New Hybrid Supercar</h1>
      </div>

    </div>

    <!-- 3 -->

    <div class="slide">

      <img src="https://images.unsplash.com/photo-1544636331-e26879cd4d9b?q=80&w=1600&auto=format&fit=crop">

      <div class="overlay"></div>

      <div class="text">
        <span>EV</span>
        <h1>Electric Cars With Future AI Tech</h1>
      </div>

    </div>

    <!-- 4 -->

    <div class="slide">

      <img src="https://images.unsplash.com/photo-1511919884226-fd3cad34687c?q=80&w=1600&auto=format&fit=crop">

      <div class="overlay"></div>

      <div class="text">
        <span>REVIEW</span>
        <h1>Porsche 911 Turbo 2026 Review</h1>
      </div>

    </div>

    <!-- 5 -->

    <div class="slide">

      <img src="https://images.unsplash.com/photo-1502877338535-766e1452684a?q=80&w=1600&auto=format&fit=crop">

      <div class="overlay"></div>

      <div class="text">
        <span>TRENDING</span>
        <h1>Ferrari Launches New Hypercar</h1>
      </div>

    </div>

  </div>

  <!-- DOTS -->

  <div class="navigation">
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
  </div>

</div>

</body>
</html>
