<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoDrive News</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #0f0f0f;
      color: #fff;
      overflow-x: hidden;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* ================= NAVBAR FIXED ================= */
    nav {
      width: 100%;
      padding: 15px 30px;
      background: #111;
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid #222;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
      color: #ff3c00;
      white-space: nowrap;
    }

    /* CENTER WRAPPER (IMPORTANT FIX) */
    .center-area {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .search-box {
      display: flex;
      gap: 10px;
    }

    .search-box input {
      width: 320px;
      padding: 10px 15px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #1c1c1c;
      color: #fff;
      outline: none;
    }

    .search-box button {
      padding: 10px 15px;
      border: none;
      border-radius: 10px;
      background: #ff3c00;
      color: #fff;
      cursor: pointer;
    }

    .menu {
      display: flex;
      gap: 20px;
      white-space: nowrap;
    }

    .menu a:hover {
      color: #ff3c00;
    }

    /* ================= OTHER STYLES SAME ================= */
    .container {
      max-width: 1400px;
      margin: auto;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 30px;
      padding: 40px 20px;
    }

    .news-card {
      display: flex;
      gap: 20px;
      background: #fff;
      color: #000;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .news-image img {
      width: 280px;
      height: 170px;
      object-fit: cover;
      border-radius: 10px;
    }

    .small-news {
      display: flex;
      gap: 10px;
      background: #fff;
      color: #000;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .small-news img {
      width: 120px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
    }

    @media(max-width: 900px) {
      nav {
        flex-wrap: wrap;
        gap: 10px;
      }

      .center-area {
        order: 3;
        width: 100%;
      }

      .search-box input {
        width: 100%;
      }

      .container {
        grid-template-columns: 1fr;
      }
    }

  </style>
</head>

<body>

<!-- NAVBAR FIXED -->
<nav>
  <div class="logo">AutoDrive</div>

  <!-- CENTER SEARCH (LOGO + MENU KE BEECH) -->
  <div class="center-area">
    <div class="search-box">
      <input id="searchInput" type="text" placeholder="Search latest news...">
      <button onclick="searchNews()">Search</button>
    </div>
  </div>

  </nav>

</html>
