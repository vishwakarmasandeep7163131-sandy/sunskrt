<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#0f172a;
    color:#fff;
}

/* HERO */

.contact-hero{
    width:100%;
    padding:80px 10%;
    text-align:center;
    background:linear-gradient(135deg,#111827,#1e293b);
}

.contact-hero h1{
    font-size:55px;
    color:#38bdf8;
    margin-bottom:20px;
}

.contact-hero p{
    color:#cbd5e1;
    font-size:18px;
    line-height:1.7;
}

/* CONTACT SECTION */

.contact-container{
    width:100%;
    padding:70px 10%;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:40px;
}

/* LEFT SIDE */

.contact-info{
    background:#111827;
    padding:40px;
    border-radius:20px;
}

.contact-info h2{
    color:#38bdf8;
    margin-bottom:25px;
    font-size:35px;
}

.contact-box{
    margin-bottom:25px;
}

.contact-box h3{
    margin-bottom:8px;
    color:#fff;
}

.contact-box p{
    color:#cbd5e1;
    line-height:1.7;
}

/* RIGHT SIDE */

.contact-form{
    background:#111827;
    padding:40px;
    border-radius:20px;
}

.contact-form h2{
    color:#38bdf8;
    margin-bottom:25px;
    font-size:35px;
}

.contact-form form{
    display:flex;
    flex-direction:column;
}

.contact-form input,
.contact-form textarea{
    width:100%;
    padding:15px;
    margin-bottom:20px;
    border:none;
    outline:none;
    border-radius:10px;
    background:#1e293b;
    color:#fff;
    font-size:16px;
}

.contact-form textarea{
    resize:none;
    height:150px;
}

.contact-form button{
    padding:15px;
    border:none;
    border-radius:10px;
    background:#38bdf8;
    color:#000;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.contact-form button:hover{
    background:#0ea5e9;
}

/* FOOTER */

footer{
    text-align:center;
    padding:25px;
    background:#020617;
    color:#94a3b8;
    margin-top:50px;
}

@media(max-width:768px){

.contact-hero h1{
    font-size:40px;
}

.contact-info h2,
.contact-form h2{
    font-size:28px;
}

}

</style>
</head>
<body>

<!-- HERO -->

<section class="contact-hero">
    <h1>Contact Us</h1>
    <p>
        Have questions, suggestions or feedback?  
        Feel free to contact us anytime.
    </p>
</section>

<!-- CONTACT SECTION -->

<section class="contact-container">

    <!-- LEFT -->

    <div class="contact-info">

        <h2>Get In Touch</h2>

        <div class="contact-box">
            <h3>Email</h3>
            <p>your@email.com</p>
        </div>

        <div class="contact-box">
            <h3>Phone</h3>
            <p>+91 9876543210</p>
        </div>

        <div class="contact-box">
            <h3>Address</h3>
            <p>Mumbai, Maharashtra, India</p>
        </div>

    </div>

    <!-- RIGHT -->

    <div class="contact-form">

        <h2>Send Message</h2>

        <form>

            <input type="text" placeholder="Your Name" required>

            <input type="email" placeholder="Your Email" required>

            <textarea placeholder="Write Your Message"></textarea>

            <button type="submit">Send Message</button>

        </form>

    </div>

</section>

<!-- FOOTER -->

<footer>
    © 2026 Your Website Name | All Rights Reserved
</footer>

</body>
</html>
