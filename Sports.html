<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoDrive - Real Live Scores</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #fff;
        }

        /* ====== HEADER ====== */
        .header {
            background: #111;
            padding: 15px 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid #222;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            color: #ff4500;
            text-decoration: none;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-box input {
            width: 350px;
            padding: 10px 18px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #1a1a1a;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .search-box input::placeholder {
            color: #666;
        }

        .search-btn {
            background: #ff4500;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .search-btn:hover {
            background: #e63e00;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        .nav-links a {
            color: #ccc;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #ff4500;
        }

        /* ====== LIVE SCORE TICKER ====== */
        .live-ticker {
            width: 100%;
            background: linear-gradient(90deg, #1a1a1a 0%, #0d0d0d 100%);
            border-bottom: 2px solid #ff4500;
            overflow: hidden;
            position: relative;
            height: 55px;
            display: flex;
            align-items: center;
        }

        .ticker-label {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            background: #ff4500;
            color: #fff;
            padding: 0 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: 13px;
            z-index: 10;
            text-transform: uppercase;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(1.3); }
        }

        .ticker-track {
            display: flex;
            white-space: nowrap;
            animation: tickerScroll 40s linear infinite;
            padding-left: 160px;
        }

        .ticker-track:hover {
            animation-play-state: paused;
        }

        .ticker-item {
            display: inline-flex;
            align-items: center;
            padding: 0 35px;
            color: #e0e0e0;
            font-size: 14px;
            position: relative;
        }

        .ticker-item::after {
            content: "⚡";
            position: absolute;
            right: 0;
            color: #ff4500;
            font-size: 12px;
        }

        .ticker-match {
            font-weight: 700;
            color: #fff;
            margin-right: 8px;
        }

        .ticker-score {
            color: #22c55e;
            font-weight: bold;
            margin: 0 8px;
            font-size: 15px;
        }

        .ticker-status {
            color: #f59e0b;
            font-size: 12px;
            margin-left: 5px;
        }

        @keyframes tickerScroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* ====== API STATUS ====== */
        .api-status {
            padding: 10px 60px;
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .api-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .api-badge.connected {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }

        .api-badge.error {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .api-badge.demo {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
        }

        /* ====== LIVE MATCHES SECTION ====== */
        .live-section {
            padding: 20px 60px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: #ff4500;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .live-badge-main {
            background: #22c55e;
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            animation: pulse 2s infinite;
        }

        .matches-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .match-card {
            background: #111;
            border-radius: 16px;
            padding: 25px;
            border: 1px solid #1a1a1a;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .match-card:hover {
            border-color: #ff4500;
            transform: translateY(-3px);
        }

        .match-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: #22c55e;
        }

        .match-tournament {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .match-teams {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .team-flag {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            border: 2px solid #333;
            font-weight: 700;
            color: #fff;
        }

        .team-name {
            font-weight: 600;
            font-size: 14px;
        }

        .team-score {
            font-size: 28px;
            font-weight: 800;
            color: #fff;
        }

        .vs-divider {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .vs-text {
            color: #ff4500;
            font-weight: bold;
            font-size: 12px;
        }

        .match-time {
            color: #666;
            font-size: 11px;
        }

        .match-status-bar {
            background: #1a1a1a;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            font-size: 13px;
            color: #22c55e;
            font-weight: 600;
        }

        .match-status-bar.upcoming {
            color: #f59e0b;
        }

        .match-status-bar.finished {
            color: #666;
        }

        .loading-spinner {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: #666;
        }

        .loading-spinner i {
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* ====== MOBILE ====== */
        @media (max-width: 1024px) {
            .header { padding: 15px 30px; }
            .search-box input { width: 250px; }
            .matches-grid { grid-template-columns: repeat(2, 1fr); }
            .live-section { padding: 20px 30px; }
            .api-status { padding: 10px 30px; }
        }

        @media (max-width: 768px) {
            .header { flex-direction: column; gap: 15px; padding: 15px 20px; }
            .nav-links { gap: 15px; flex-wrap: wrap; justify-content: center; }
            .search-box input { width: 200px; }
            .ticker-track { padding-left: 130px; animation-duration: 25s; }
            .matches-grid { grid-template-columns: 1fr; }
            .live-section { padding: 20px; }
            .api-status { padding: 10px 20px; flex-wrap: wrap; }
        }
    </style>
</head>
<body>

    <!-- ====== HEADER ====== -->
    <header class="header">
        <a href="#" class="logo">AutoDrive</a>
        <div class="search-box">
            <input type="text" placeholder="Search latest news...">
            <button class="search-btn">Search</button>
        </div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#" class="active">Sports</a></li>
            <li><a href="#">Health</a></li>
            <li><a href="#">Cars</a></li>
            <li><a href="#">News</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </header>

    <!-- ====== LIVE SCORE TICKER ====== -->
    <div class="live-ticker">
        <div class="ticker-label">
            <span class="pulse-dot"></span>
            LIVE SCORES
        </div>
        <div class="ticker-track" id="tickerTrack"></div>
    </div>

    <!-- ====== API STATUS ====== -->
    <div class="api-status">
        <span class="api-badge demo" id="apiStatus">
            <i class="fas fa-circle" style="font-size:8px;"></i>
            DEMO MODE — Add API Key for Real Scores
        </span>
        <span style="color: #666; font-size: 12px;">
            Get free API key from <a href="https://www.cricapi.com/" target="_blank" style="color: #ff4500;">cricapi.com</a>
        </span>
    </div>

    <!-- ====== LIVE MATCHES ====== -->
    <section class="live-section">
        <div class="section-header">
            <h2 class="section-title">
                <i class="fas fa-circle" style="color: #22c55e; font-size: 10px;"></i>
                Live Matches
            </h2>
            <span class="live-badge-main">● LIVE</span>
        </div>
        
        <div class="loading-spinner" id="loadingSpinner">
            <i class="fas fa-spinner"></i> Loading live scores...
        </div>
        
        <div class="matches-grid" id="matchesGrid" style="display: none;"></div>
    </section>

    <script>
        // ====== API CONFIGURATION ======
        // STEP 1: Sign up at https://www.cricapi.com/ (FREE)
        // STEP 2: Get your API key
        // STEP 3: Paste it below
        const CRIC_API_KEY = 'YOUR_CRICAPI_KEY_HERE'; // <-- YAHAN API KEY DALEIN
        
        // SportMonks API (Football) — https://www.sportmonks.com/
        const SPORTMONKS_KEY = 'YOUR_SPORTMONKS_KEY_HERE'; // <-- YAHAN API KEY DALEIN

        let liveMatches = [];
        let isRealData = false;

        // ====== FETCH REAL CRICKET SCORES ======
        async function fetchCricketScores() {
            if (CRIC_API_KEY === 'YOUR_CRICAPI_KEY_HERE') {
                console.log('⚠️ No API key found. Using demo data.');
                return null;
            }

            try {
                const response = await fetch(`https://api.cricapi.com/v1/currentMatches?apikey=${CRIC_API_KEY}&offset=0`);
                const data = await response.json();
                
                if (data.status === 'success' && data.data) {
                    return data.data.map(match => ({
                        id: match.id,
                        tournament: match.series,
                        team1: {
                            name: match.teams[0],
                            flag: match.teams[0].substring(0, 2).toUpperCase(),
                            score: match.score ? match.score[0]?.r || 0 : 0,
                            wickets: match.score ? match.score[0]?.w || 0 : 0,
                            overs: match.score ? match.score[0]?.o || 0 : 0
                        },
                        team2: {
                            name: match.teams[1],
                            flag: match.teams[1].substring(0, 2).toUpperCase(),
                            score: match.score ? match.score[1]?.r || 0 : 0,
                            wickets: match.score ? match.score[1]?.w || 0 : 0,
                            overs: match.score ? match.score[1]?.o || 0 : 0
                        },
                        status: match.status,
                        isLive: match.matchStarted && !match.matchEnded
                    }));
                }
            } catch (error) {
                console.error('❌ Cricket API Error:', error);
            }
            return null;
        }

        // ====== FETCH REAL FOOTBALL SCORES ======
        async function fetchFootballScores() {
            if (SPORTMONKS_KEY === 'YOUR_SPORTMONKS_KEY_HERE') {
                return null;
            }

            try {
                // Using free tier endpoint
                const response = await fetch(`https://api.sportmonks.com/v3/football/livescores?api_token=${SPORTMONKS_KEY}`);
                const data = await response.json();
                
                if (data.data) {
                    return data.data.map(match => ({
                        id: `fb-${match.id}`,
                        tournament: match.league?.name || 'Football',
                        team1: {
                            name: match.participants?.[0]?.name || 'Team A',
                            flag: match.participants?.[0]?.short_code || 'T1',
                            score: match.scores?.find(s => s.description === 'CURRENT')?.score?.participant1 || 0,
                            wickets: null,
                            overs: null
                        },
                        team2: {
                            name: match.participants?.[1]?.name || 'Team B',
                            flag: match.participants?.[1]?.short_code || 'T2',
                            score: match.scores?.find(s => s.description === 'CURRENT')?.score?.participant2 || 0,
                            wickets: null,
                            overs: null
                        },
                        status: `${match.minute || 0}' • ${match.state?.name || 'Live'}`,
                        isLive: true
                    }));
                }
            } catch (error) {
                console.error('❌ Football API Error:', error);
            }
            return null;
        }

        // ====== DEMO DATA (Fallback) ======
        function getDemoData() {
            return [
                {
                    id: 1,
                    tournament: "ICC World Test Championship",
                    team1: { name: "India", flag: "IN", score: 287, wickets: 4, overs: 78.2 },
                    team2: { name: "Australia", flag: "AU", score: 0, wickets: 0, overs: 0 },
                    status: "Day 2 • India batting",
                    isLive: true
                },
                {
                    id: 2,
                    tournament: "IPL 2026",
                    team1: { name: "Mumbai Indians", flag: "MI", score: 156, wickets: 3, overs: 15.2 },
                    team2: { name: "Chennai Super Kings", flag: "CSK", score: 0, wickets: 0, overs: 0 },
                    status: "MI batting • 15.2 overs",
                    isLive: true
                },
                {
                    id: 3,
                    tournament: "FIFA World Cup Qualifiers",
                    team1: { name: "India", flag: "IN", score: 2, wickets: null, overs: null },
                    team2: { name: "Qatar", flag: "QA", score: 1, wickets: null, overs: null },
                    status: "78' • 2nd Half",
                    isLive: true
                },
                {
                    id: 4,
                    tournament: "Wimbledon 2026",
                    team1: { name: "Djokovic", flag: "DJ", score: 6, wickets: null, overs: null },
                    team2: { name: "Alcaraz", flag: "AL", score: 4, wickets: null, overs: null },
                    status: "Set 3 • 3-2",
                    isLive: true
                },
                {
                    id: 5,
                    tournament: "Hockey World Cup",
                    team1: { name: "India", flag: "IN", score: 3, wickets: null, overs: null },
                    team2: { name: "Pakistan", flag: "PK", score: 1, wickets: null, overs: null },
                    status: "Q3 • 12 minutes",
                    isLive: true
                },
                {
                    id: 6,
                    tournament: "Pro Kabaddi League",
                    team1: { name: "Patna Pirates", flag: "PP", score: 28, wickets: null, overs: null },
                    team2: { name: "Bengaluru Bulls", flag: "BB", score: 24, wickets: null, overs: null },
                    status: "2nd Half • 15 min left",
                    isLive: true
                }
            ];
        }

        // ====== RENDER TICKER ======
        function renderTicker() {
            const track = document.getElementById('tickerTrack');
            let html = '';
            
            liveMatches.forEach(match => {
                const score1 = match.team1.score + (match.team1.wickets !== null ? '/' + match.team1.wickets : '');
                const score2 = match.team2.score + (match.team2.wickets !== null ? '/' + match.team2.wickets : '');
                
                html += `
                    <div class="ticker-item">
                        <span class="ticker-match">${match.team1.name} vs ${match.team2.name}</span>
                        <span class="ticker-score">${score1}</span>
                        <span style="color:#666;margin:0 5px;">vs</span>
                        <span class="ticker-score losing">${score2}</span>
                        <span class="ticker-status">${match.status}</span>
                    </div>
                `;
            });
            
            track.innerHTML = html + html;
        }

        // ====== RENDER MATCH CARDS ======
        function renderMatches() {
            const grid = document.getElementById('matchesGrid');
            const spinner = document.getElementById('loadingSpinner');
            
            spinner.style.display = 'none';
            grid.style.display = 'grid';
            
            grid.innerHTML = liveMatches.map(match => {
                const score1 = match.team1.score + (match.team1.wickets !== null ? '/' + match.team1.wickets : '');
                const score2 = match.team2.score + (match.team2.wickets !== null ? '/' + match.team2.wickets : '');
                
                return `
                    <div class="match-card" id="match-${match.id}">
                        <div class="match-tournament">${match.tournament}</div>
                        <div class="match-teams">
                            <div class="team">
                                <div class="team-flag">${match.team1.flag}</div>
                                <span class="team-name">${match.team1.name}</span>
                                <span class="team-score" id="score1-${match.id}">${score1}</span>
                            </div>
                            <div class="vs-divider">
                                <span class="vs-text">VS</span>
                                <span class="match-time">${match.status}</span>
                            </div>
                            <div class="team">
                                <div class="team-flag">${match.team2.flag}</div>
                                <span class="team-name">${match.team2.name}</span>
                                <span class="team-score" id="score2-${match.id}">${score2}</span>
                            </div>
                        </div>
                        <div class="match-status-bar">● ${match.status}</div>
                    </div>
                `;
            }).join('');
        }

        // ====== UPDATE API STATUS ======
        function updateApiStatus(status, message) {
            const badge = document.getElementById('apiStatus');
            badge.className = `api-badge ${status}`;
            badge.innerHTML = `<i class="fas fa-circle" style="font-size:8px;"></i> ${message}`;
        }

        // ====== INITIALIZE ======
        async function init() {
            // Try to fetch real data
            const cricketData = await fetchCricketScores();
            const footballData = await fetchFootballScores();
            
            if (cricketData || footballData) {
                liveMatches = [
                    ...(cricketData || []),
                    ...(footballData || [])
                ];
                isRealData = true;
                updateApiStatus('connected', '● REAL LIVE DATA CONNECTED');
                console.log('✅ Real API data loaded!');
            } else {
                // Fallback to demo
                liveMatches = getDemoData();
                updateApiStatus('demo', '⚠ DEMO MODE — Add API Key for Real Scores');
                console.log('⚠ Using demo data. Add API keys for real scores.');
            }
            
            renderTicker();
            renderMatches();
        }

        // ====== AUTO-REFRESH REAL DATA ======
        setInterval(async () => {
            if (isRealData) {
                const cricketData = await fetchCricketScores();
                const footballData = await fetchFootballScores();
                
                if (cricketData || footballData) {
                    liveMatches = [
                        ...(cricketData || []),
                        ...(footballData || [])
                    ];
                    renderTicker();
                    renderMatches();
                    console.log('🔄 Real scores refreshed at:', new Date().toLocaleTimeString());
                }
            } else {
                // Demo mode: random update
                liveMatches.forEach(match => {
                    if (!match.isLive) return;
                    const increment = Math.floor(Math.random() * 3);
                    
                    if (match.tournament.includes("Cricket") || match.tournament.includes("IPL")) {
                        match.team1.score += increment;
                        if (Math.random() > 0.92 && match.team1.wickets < 10) {
                            match.team1.wickets += 1;
                        }
                    } else if (match.tournament.includes("FIFA") || match.tournament.includes("Hockey")) {
                        if (Math.random() > 0.95) match.team1.score += 1;
                    } else if (match.tournament.includes("Tennis")) {
                        match.team1.score += increment;
                    } else {
                        match.team1.score += increment;
                        match.team2.score += Math.floor(Math.random() * 2);
                    }
                });
                renderTicker();
                renderMatches();
            }
        }, 60000); // Refresh every 60 seconds

        // Start
        init();
    </script>

</body>
</html>
