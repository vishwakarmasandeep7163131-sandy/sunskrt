<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoDrive Navbar</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

/* NAVBAR */
.navbar {
  width: 100%;
  height: 70px;
  background: #111;
  color: white;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  position: relative;
}

/* LOGO */
.logo {
  font-size: 22px;
  font-weight: bold;
}

/* CENTER SEARCH BOX */
.search-box {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}

.search-box input {
  width: 250px;
  padding: 8px 15px;
  border-radius: 25px;
  border: none;
  outline: none;
}

/* MENU */
.menu {
  display: flex;
  gap: 20px;
}

.menu a {
  color: white;
  text-decoration: none;
  font-size: 16px;
  transition: 0.3s;
}

.menu a:hover {
  color: orange;
}
</style>
</head>

<body>

<div class="navbar">
  <div class="logo">AutoDrive</div>

  <div class="search-box">
    <input type="text" placeholder="Search cars, news...">
  </div>

  <div class="menu">
    <a href="#">Home</a>
    <a href="#">News</a>
    <a href="#">Cars</a>
    <a href="#">Contact</a>
  </div>
</div>

</body>
</html>

  <!-- SEARCH -->
  <div class="search-box">
    <input id="searchInput" type="text" placeholder="Search latest news...">
    <button onclick="searchNews()">Search</button>
  </div>

  <!-- MAIN CONTENT -->
  <div class="container">

    <!-- LEFT -->
    <div class="left-news">
      <h2>Sports News</h2>

      <div class="news-card">
        <div class="news-image">
          <img src="https://images.unsplash.com/photo-1547347298-4074fc3086f0">
        </div>
        <div>
          <div class="news-title">SAFF Women's Championship Squad Announced</div>
          <div class="news-desc">Final squad selected for upcoming tournament.</div>
        </div>
      </div>

    </div>

    <!-- RIGHT -->
    <div class="right-news">
      <h2>Most Read</h2>

      <div class="small-news">
        <img src="https://images.unsplash.com/photo-1521737604893-d14cc237f11d">
        <div>Government updates policy changes</div>
      </div>

    </div>

  </div>

  <!-- PAGINATION -->
  <div class="pagination">
    <a class="active" href="#">1</a>
    <a href="#">2</a>
    <a href="#">3</a>
    <span>...</span>
    <a href="#">10</a>
  </div>

  <!-- SOCIAL -->
  <div class="social-icons">
    <a class="fb">f</a>
    <a class="tw">x</a>
    <a class="ig">i</a>
    <a class="yt">y</a>
    <a class="wp">w</a>
  </div>

  <script>
    function searchNews() {
      const value = document.getElementById('searchInput').value;
      if (value.trim()) {
        window.location.href = `https://www.google.com/search?q=${value}+news`;
      }
    }
  </script>

</body>
</html>
