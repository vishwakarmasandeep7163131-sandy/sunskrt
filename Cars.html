<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoDrive News</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* ================= GLOBAL ================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#000;
  color:white;
  overflow-x:hidden;
}

a{
  text-decoration:none;
  color:inherit;
}

/* ================= NAVBAR ================= */

nav{
  width:100%;
  padding:15px 30px;
  background:#000;
  border-bottom:1px solid #222;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:1000;
}

.logo{
  font-size:28px;
  font-weight:700;
  color:#ff3c00;
}

/* SEARCH CENTER */

.center-area{
  flex:1;
  display:flex;
  justify-content:center;
}

.search-box{
  display:flex;
  gap:10px;
}

.search-box input{
  width:320px;
  padding:11px 15px;
  border-radius:10px;
  border:1px solid #333;
  background:#111;
  color:white;
  outline:none;
}

.search-box button{
  padding:11px 18px;
  border:none;
  border-radius:10px;
  background:#ff3c00;
  color:white;
  cursor:pointer;
  font-weight:600;
}

/* MENU */

.menu{
  display:flex;
  gap:20px;
}

.menu a{
  color:white;
  transition:0.3s;
}

.menu a:hover{
  color:#ff3c00;
}

/* ================= MAIN ================= */

.container{
  max-width:1400px;
  margin:50px auto;
  padding:0 20px;
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:25px;
}

/* ================= SLIDER ================= */

.banner{
  width:100%;
  height:520px;
  border-radius:18px;
  overflow:hidden;
  position:relative;
}

.slides{
  display:flex;
  width:500%;
  height:100%;
  animation:slider 25s infinite;
}

.slide{
  width:20%;
  position:relative;
}

.slide img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(to top, rgba(0,0,0,0.9), transparent);
}

.text{
  position:absolute;
  left:30px;
  bottom:30px;
  z-index:5;
}

.tag{
  background:#ff3c00;
  color:white;
  padding:6px 14px;
  border-radius:5px;
  display:inline-block;
  margin-bottom:15px;
  font-size:13px;
  font-weight:bold;
}

.text h1{
  font-size:42px;
  line-height:1.3;
  color:white;
}

/* ================= SIDEBAR ================= */

.sidebar{
  display:flex;
  flex-direction:column;
  gap:20px;
}

.side-card{
  background:#111;
  border-radius:16px;
  overflow:hidden;
  border:1px solid #222;
  transition:0.3s;
}

.side-card:hover{
  transform:translateY(-5px);
}

.side-card img{
  width:100%;
  height:180px;
  object-fit:cover;
}

.side-content{
  padding:15px;
}

.side-content h3{
  color:white;
  margin-bottom:10px;
}

.side-content p{
  color:#aaa;
  line-height:1.6;
}

/* ================= STORIES ================= */

.stories{
  max-width:1200px;
  margin:40px auto;
  padding:0 20px;
}

.stories h2{
  font-size:32px;
  margin-bottom:25px;
  color:white;
}

.story-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
}

.story{
  background:#111;
  border-radius:15px;
  overflow:hidden;
  border:1px solid #222;
  transition:0.3s;
}

.story:hover{
  transform:translateY(-6px);
}

.story img{
  width:100%;
  height:200px;
  object-fit:cover;
}

.story-text{
  padding:15px;
}

.story-text h3{
  color:white;
  line-height:1.5;
}

/* BUTTON */

.btn-box{
  text-align:center;
  margin-top:30px;
}

.btn-box a{
  display:inline-block;
  padding:13px 32px;
  background:#ff3c00;
  color:white;
  border-radius:50px;
  font-weight:bold;
  transition:0.3s;
}

.btn-box a:hover{
  background:white;
  color:black;
}

/* ================= ARTICLES ================= */

.latest-section{
  max-width:1200px;
  margin:40px auto;
  padding:0 20px;
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:25px;
}

.section-title{
  font-size:34px;
  margin-bottom:25px;
  color:white;
}

.article-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.article-card{
  background:#111;
  border-radius:14px;
  overflow:hidden;
  border:1px solid #222;
  transition:0.3s;
}

.article-card:hover{
  transform:translateY(-5px);
}

.article-image{
  position:relative;
  height:190px;
}

.article-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.badge{
  position:absolute;
  top:10px;
  left:10px;
  background:#ff3c00;
  color:white;
  padding:5px 10px;
  border-radius:5px;
  font-size:12px;
  font-weight:bold;
}

.article-content{
  padding:15px;
}

.article-content h3{
  color:white;
  line-height:1.5;
  margin-bottom:10px;
}

.article-content p{
  color:#aaa;
}

/* ================= SIDEBAR BOX ================= */

.latest-sidebar{
  display:flex;
  flex-direction:column;
  gap:20px;
}

.poll-box,
.trending-box{
  background:#111;
  border-radius:14px;
  padding:20px;
  border:1px solid #222;
}

.poll-box h3,
.trending-box h3{
  color:white;
  margin-bottom:15px;
}

.poll-box p,
.poll-box label{
  color:#aaa;
}

.poll-box button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#ff3c00;
  color:white;
  margin-top:15px;
  cursor:pointer;
}

/* TREND */

.trend-item{
  display:flex;
  gap:12px;
  margin-bottom:18px;
  border-bottom:1px solid #222;
  padding-bottom:10px;
}

.trend-item img{
  width:90px;
  height:70px;
  object-fit:cover;
  border-radius:8px;
}

.trend-item h4{
  color:white;
  margin-bottom:5px;
}

.trend-item span{
  color:#aaa;
  font-size:13px;
}

/* DOTS */

.dots{
  position:absolute;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:8px;
}

.dots span{
  width:10px;
  height:10px;
  background:white;
  border-radius:50%;
  opacity:0.6;
}

/* SLIDER */

@keyframes slider{

0%{transform:translateX(0%);}
15%{transform:translateX(0%);}

20%{transform:translateX(-20%);}
35%{transform:translateX(-20%);}

40%{transform:translateX(-40%);}
55%{transform:translateX(-40%);}

60%{transform:translateX(-60%);}
75%{transform:translateX(-60%);}

80%{transform:translateX(-80%);}
95%{transform:translateX(-80%);}

100%{transform:translateX(0%);}

}

/* ================= MOBILE ================= */

@media(max-width:950px){

.container,
.latest-section{
  grid-template-columns:1fr;
}

.story-grid{
  grid-template-columns:repeat(2,1fr);
}

.article-grid{
  grid-template-columns:repeat(2,1fr);
}

nav{
  flex-wrap:wrap;
  gap:15px;
}

.center-area{
  width:100%;
  order:3;
}

}

@media(max-width:650px){

.banner{
  height:320px;
}

.text h1{
  font-size:24px;
}

.story-grid,
.article-grid{
  grid-template-columns:1fr;
}

.search-box{
  width:100%;
}

.search-box input{
  width:100%;
}

}

</style>
</head>

<body>

<!-- NAVBAR -->

<nav>

<div class="logo">AutoDrive</div>

<div class="center-area">

<div class="search-box">

<input type="text" placeholder="Search latest news...">

<button>Search</button>

</div>

</div>

<div class="menu">
<a href="#">Home</a>
<a href="#">Sports</a>
<a href="#">Health</a>
<a href="#">Cars</a>
<a href="#">News</a>
<a href="#">About</a>
<a href="#">Contact</a>
</div>

</nav>

<!-- MAIN -->

<div class="container">

<!-- LEFT -->

<div class="banner">

<div class="slides">

<div class="slide">
<img src="https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?q=80&w=1600&auto=format&fit=crop">
<div class="overlay"></div>
<div class="text">
<div class="tag">NEWS</div>
<h1>2026 Mercedes AMG GT Coupe Revealed</h1>
</div>
</div>

<div class="slide">
<img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?q=80&w=1600&auto=format&fit=crop">
<div class="overlay"></div>
<div class="text">
<div class="tag">SPORTS</div>
<h1>Lamborghini Hybrid Supercar Launch</h1>
</div>
</div>

</div>

</div>

<!-- RIGHT -->

<div class="sidebar">

<div class="side-card">

<div class="side-content">

<p>New generation BMW sports coupe with upgraded power.</p>
</div>

</div>

<div class="side-card">
<img src="https://images.unsplash.com/photo-1555215695-3004980ad54e?q=80&w=1200&auto=format&fit=crop">

<div class="side-content">
<h3>Audi RS7 New Features</h3>

</div>

</div>

</div>

</div>

</body>
</html>
